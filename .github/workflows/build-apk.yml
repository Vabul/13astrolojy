        import androidx.lifecycle.viewmodel.compose.viewModel
        import com.astro13.model.ChartInput
        import com.astro13.model.ChartResult
        import com.astro13.model.PlanetPoint
        import java.util.Calendar
        object C {
            val Bg=Color(0xFF0D0D1A); val Sf=Color(0xFF1A1A2E); val SfL=Color(0xFF16213E)
            val Au=Color(0xFFFFD700); val AuL=Color(0xFFFFE55C); val Pu=Color(0xFF7B2FBE)
            val PuL=Color(0xFFAB6BE8); val Te=Color(0xFF00BCD4); val Tx=Color(0xFFE8E8F0)
            val Ts=Color(0xFF9090A8); val Re=Color(0xFFFF6B6B); val Op=Color(0xFF4CAF50)
            val Dv=Color(0xFF2A2A4A)
        }
        @Composable fun Th(c: @Composable ()->Unit)=MaterialTheme(colorScheme=darkColorScheme(background=C.Bg,surface=C.Sf,primary=C.Au,onPrimary=Color.Black,onBackground=C.Tx,onSurface=C.Tx),content=c)
        class MainActivity:ComponentActivity() {
            override fun onCreate(s:Bundle?) { super.onCreate(s); setContent { Th { Surface(Modifier.fillMaxSize(),color=C.Bg){App()} } } }
        }
        @Composable fun App(vm:ChartViewModel=viewModel()) {
            val state by vm.state.collectAsStateWithLifecycle()
            val cal=Calendar.getInstance()
            var year by remember{mutableStateOf(cal.get(Calendar.YEAR).toString())}
            var month by remember{mutableStateOf((cal.get(Calendar.MONTH)+1).toString())}
            var day by remember{mutableStateOf(cal.get(Calendar.DAY_OF_MONTH).toString())}
            var hour by remember{mutableStateOf(cal.get(Calendar.HOUR_OF_DAY).toString())}
            var min by remember{mutableStateOf(cal.get(Calendar.MINUTE).toString())}
            var lat by remember{mutableStateOf("35.6892")}
            var lon by remember{mutableStateOf("51.3890")}
            var tz by remember{mutableStateOf("3.5")}
            var wheel by remember{mutableStateOf(false)}
            LazyColumn(Modifier.fillMaxSize().padding(horizontal=14.dp),verticalArrangement=Arrangement.spacedBy(10.dp)) {
                item { Spacer(Modifier.height(14.dp)); Column(Modifier.fillMaxWidth(),horizontalAlignment=Alignment.CenterHorizontally){
                    Text("⭐  مواضع حقیقی کواکب  ⭐",color=C.Au,fontSize=20.sp,fontWeight=FontWeight.Bold)
                    Text("۱۳ برجی · الگوریتم Meeus · پایه JPL/ناسا",color=C.Ts,fontSize=12.sp)
                    Spacer(Modifier.height(6.dp)); Divider(color=C.Dv)
                }}
                item { Card(Modifier.fillMaxWidth(),colors=CardDefaults.cardColors(C.Sf),shape=RoundedCornerShape(12.dp)){
                    Column(Modifier.padding(12.dp),verticalArrangement=Arrangement.spacedBy(8.dp)){
                        Text("📅  تاریخ و زمان (میلادی)",color=C.Au,fontSize=13.sp,fontWeight=FontWeight.SemiBold)
                        Row(horizontalArrangement=Arrangement.spacedBy(6.dp)){
                            F("سال",year,Modifier.weight(1.4f)){year=it}; F("ماه",month,Modifier.weight(1f)){month=it}; F("روز",day,Modifier.weight(1f)){day=it}
                        }
                        Row(horizontalArrangement=Arrangement.spacedBy(6.dp)){
                            F("ساعت",hour,Modifier.weight(1f)){hour=it}; F("دقیقه",min,Modifier.weight(1f)){min=it}; F("UTC+",tz,Modifier.weight(1f)){tz=it}
                        }
                    }
                }}
                item { Card(Modifier.fillMaxWidth(),colors=CardDefaults.cardColors(C.Sf),shape=RoundedCornerShape(12.dp)){
                    Column(Modifier.padding(12.dp),verticalArrangement=Arrangement.spacedBy(8.dp)){
                        Text("📍  موقعیت جغرافیایی",color=C.Au,fontSize=13.sp,fontWeight=FontWeight.SemiBold)
                        Row(horizontalArrangement=Arrangement.spacedBy(6.dp)){
                            F("عرض (Lat)",lat,Modifier.weight(1f)){lat=it}; F("طول (Lon)",lon,Modifier.weight(1f)){lon=it}
                        }
                        Text("تهران: lat=35.69  lon=51.39  UTC=3.5",color=C.Ts,fontSize=11.sp)
                    }
                }}
                item { Button(onClick={vm.calculate(ChartInput(year.toIntOrNull()?:2024,month.toIntOrNull()?:1,day.toIntOrNull()?:1,hour.toIntOrNull()?:0,min.toIntOrNull()?:0,latitude=lat.toDoubleOrNull()?:35.69,longitude=lon.toDoubleOrNull()?:51.39,timezone=tz.toDoubleOrNull()?:3.5))},Modifier.fillMaxWidth().height(50.dp),colors=ButtonDefaults.buttonColors(C.Au,Color.Black),shape=RoundedCornerShape(12.dp)){
                    Text("محاسبه‌ی موضع کواکب",fontSize=15.sp,fontWeight=FontWeight.Bold)
                }}
                when(val s=state){
                    is ChartState.Loading -> item{Box(Modifier.fillMaxWidth().padding(24.dp),Alignment.Center){CircularProgressIndicator(color=C.Au)}}
                    is ChartState.Error -> item{Text("❌ ${s.message}",color=C.Re,modifier=Modifier.padding(8.dp))}
                    is ChartState.Success -> {
                        val ch=s.result
                        item { Card(Modifier.fillMaxWidth(),colors=CardDefaults.cardColors(C.SfL),shape=RoundedCornerShape(10.dp)){
                            Column(Modifier.padding(12.dp).fillMaxWidth(),horizontalAlignment=Alignment.CenterHorizontally){
                                Text("${ch.input.day}/${ch.input.month}/${ch.input.year}  —  ${ch.input.hour}:${"%02d".format(ch.input.minute)}  UTC+${ch.input.timezone}",color=C.AuL,fontSize=13.sp,fontWeight=FontWeight.Medium)
                                Text("JD = ${"%.4f".format(ch.julianDay)}",color=C.Ts,fontSize=11.sp)
                            }
                        }}
                        item { OutlinedButton(onClick={wheel=!wheel},Modifier.fillMaxWidth(),border=BorderStroke(1.dp,C.Pu),shape=RoundedCornerShape(10.dp)){
                            Text(if(wheel)"پنهان کردن چرخ" else "نمایش چرخ دایره‌البروج",color=C.PuL,fontSize=13.sp)
                        }}
                        if(wheel) item{Box(Modifier.fillMaxWidth(),Alignment.Center){ZodiacWheel(ch,Modifier.size(280.dp))}}
                        item{Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.spacedBy(8.dp)){SC(ch.ascendant,C.Pu,Modifier.weight(1f));SC(ch.midheaven,C.Te,Modifier.weight(1f))}}
                        item{TH()}
                        items(ch.planets){PR(it)}
                        item{PR(ch.northNode)}; item{PR(ch.southNode)}
                        item{Spacer(Modifier.height(32.dp))}
                    }
                    else->{}
                }
            }
        }
        @Composable fun F(label:String,value:String,modifier:Modifier,onChange:(String)->Unit){
            OutlinedTextField(value=value,onValueChange=onChange,label={Text(label,fontSize=11.sp,color=C.Ts)},modifier=modifier,
                keyboardOptions=KeyboardOptions(keyboardType=KeyboardType.Decimal),singleLine=true,
                colors=OutlinedTextFieldDefaults.colors(focusedBorderColor=C.Au,unfocusedBorderColor=C.Dv,focusedTextColor=C.Tx,unfocusedTextColor=C.Tx,cursorColor=C.Au),
                textStyle=LocalTextStyle.current.copy(fontSize=14.sp))
        }
        @Composable fun SC(p:PlanetPoint,ac:Color,m:Modifier){
            Card(m,colors=CardDefaults.cardColors(C.Sf),shape=RoundedCornerShape(10.dp),border=BorderStroke(1.dp,ac.copy(0.4f))){
                Column(Modifier.padding(10.dp).fillMaxWidth(),horizontalAlignment=Alignment.CenterHorizontally){
                    Text(p.symbol,color=ac,fontSize=18.sp)
                    Text(p.nameAr,color=C.Tx,fontSize=12.sp,fontWeight=FontWeight.Bold)
                    Text("${"%.4f".format(p.longitude)}°",color=ac,fontSize=14.sp,fontWeight=FontWeight.Bold)
                    Text("${p.signSymbol} ${p.signName}",color=C.Ts,fontSize=12.sp)
                    Text(dms(p.degreeInSign),color=C.Ts,fontSize=11.sp)
                }
            }
        }
        @Composable fun TH(){Row(Modifier.fillMaxWidth().background(C.SfL,RoundedCornerShape(topStart=10.dp,topEnd=10.dp)).padding(10.dp,8.dp)){
            Text("کوکب",color=C.Au,fontSize=12.sp,fontWeight=FontWeight.Bold,modifier=Modifier.weight(1.4f))
            Text("درجه ۰–۳۶۰",color=C.Au,fontSize=12.sp,fontWeight=FontWeight.Bold,modifier=Modifier.weight(1.5f),textAlign=TextAlign.Center)
            Text("برج",color=C.Au,fontSize=12.sp,fontWeight=FontWeight.Bold,modifier=Modifier.weight(1f),textAlign=TextAlign.Center)
            Text("در برج",color=C.Au,fontSize=12.sp,fontWeight=FontWeight.Bold,modifier=Modifier.weight(1.3f),textAlign=TextAlign.End)
        }; Divider(color=C.Au.copy(0.25f))}
        @Composable fun PR(p:PlanetPoint){
            val isO=p.signName=="مارافسا"
            Row(Modifier.fillMaxWidth().background(if(isO)C.Op.copy(0.07f) else Color.Transparent).padding(10.dp,8.dp),verticalAlignment=Alignment.CenterVertically){
                Column(Modifier.weight(1.4f)){
                    Text("${p.symbol} ${p.nameAr}",color=if(p.isRetrograde)C.Re else C.Tx,fontSize=13.sp,fontWeight=FontWeight.Medium)
                    if(p.isRetrograde)Text("℞ رجعی",color=C.Re,fontSize=10.sp)
                }
                Text("${"%.4f".format(p.longitude)}°",color=C.AuL,fontSize=13.sp,fontWeight=FontWeight.Bold,modifier=Modifier.weight(1.5f),textAlign=TextAlign.Center)
                Text("${p.signSymbol} ${p.signName}",color=if(isO)C.Op else C.PuL,fontSize=12.sp,modifier=Modifier.weight(1f),textAlign=TextAlign.Center)
                Text(dms(p.degreeInSign),color=C.Ts,fontSize=12.sp,modifier=Modifier.weight(1.3f),textAlign=TextAlign.End)
            }
            Divider(color=C.Dv,thickness=0.5.dp)
        }
        fun dms(d:Double):String{val i=d.toInt();val m=((d-i)*60).toInt();val s=(((d-i)*60-m)*60).toInt();return "$i° $m' $s\""}
        KOTLIN

    - name: Setup Gradle Wrapper
      run: |
        cd project
        gradle wrapper --gradle-version 8.6

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Licenses
      run: yes | sdkmanager --licenses || true

    - name: Build Debug APK
      working-directory: project
      run: ./gradlew assembleDebug --stacktrace --no-daemon
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Astro13-Debug-APK
        path: project/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Show APK info
      run: |
        ls -lh project/app/build/outputs/apk/debug/
        echo "✅ APK آماده است! از تب Artifacts دانلود کنید"
